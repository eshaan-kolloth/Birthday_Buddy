name: Publish OTA update

# Every push to main (that passes the checks) is published to your Expo account
# as an EAS Update on the `main` branch. In Expo Go you then just open
# Projects -> BirthdayBuddy and get the latest version: no PC, no QR code.
# Installed development/preview/production builds can receive it too once
# their channel is linked to the `main` branch (see the README).
#
# OTA only ships JavaScript/assets. A new Expo SDK still needs a new build.
#
# One-time setup (GitHub: Settings -> Secrets and variables -> Actions):
#   EXPO_TOKEN                        https://expo.dev/settings/access-tokens
#   EXPO_PUBLIC_GROQ_API_KEY          the same values you keep in your local .env
#   EXPO_PUBLIC_EMAILJS_SERVICE_ID
#   EXPO_PUBLIC_EMAILJS_TEMPLATE_ID
#   EXPO_PUBLIC_EMAILJS_PUBLIC_KEY
#   EXPO_PUBLIC_FIREBASE_PROJECT_ID   (optional, has a built-in default)
# The .env file is git-ignored, so without these secrets the published app would
# have no chat key and no email settings. Without EXPO_TOKEN this is a no-op.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "scripts/**"
      - ".github/workflows/birthday-emails.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      UPDATE_MESSAGE: ${{ github.event.head_commit.message }}

    steps:
      - name: EXPO_TOKEN missing
        if: env.EXPO_TOKEN == ''
        run: echo "::notice::Add an EXPO_TOKEN repository secret to enable automatic OTA updates."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: "24"
          cache: npm

      - name: Install and verify
        if: env.EXPO_TOKEN != ''
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update to the main branch
        if: env.EXPO_TOKEN != ''
        env:
          EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
          EXPO_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.EXPO_PUBLIC_EMAILJS_SERVICE_ID }}
          EXPO_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.EXPO_PUBLIC_EMAILJS_TEMPLATE_ID }}
          EXPO_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.EXPO_PUBLIC_EMAILJS_PUBLIC_KEY }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
        run: eas update --branch main --message "${UPDATE_MESSAGE:-OTA update}" --non-interactive
