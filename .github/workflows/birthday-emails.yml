name: Send Birthday Emails

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC = 09:00 IST, every day
  workflow_dispatch: # Allows manual trigger from GitHub

permissions:
  contents: read

concurrency:
  group: birthday-emails
  cancel-in-progress: false

jobs:
  send-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # "Today" and "tomorrow" are evaluated in the owner's time zone.
      TZ: Asia/Kolkata

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # Not saved to package.json: the app itself never uses firebase-admin.
        run: npm install --no-save --no-audit --no-fund firebase-admin@14

      - name: Run birthday email script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
        # Exits non-zero if any email fails, so a broken run is never green.
        run: node scripts/sendBirthdayEmails.js
